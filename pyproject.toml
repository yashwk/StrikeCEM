[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strikecem"
version = "0.1.0"
description = "StrikeCEM Python SDK: Real-Time Radar Cross Section (RCS) Query Engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "StrikeCEM Team" }
]
keywords = ["radar", "rcs", "electromagnetics", "aerospace", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
numpy = ["numpy>=1.20"]

[tool.setuptools.packages.find]
where = ["python"]
