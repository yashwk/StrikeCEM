name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        preset: [debug, release, sanitize]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libssl-dev
      - name: Select compiler
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      - name: CLI smoke test
        run: |
          ./build/${{ matrix.preset }}/strikecem validate tests/fixtures/valid_minimal.json
          ./build/${{ matrix.preset }}/strikecem estimate tests/fixtures/valid_sweep_grid.json
          if ./build/${{ matrix.preset }}/strikecem validate tests/fixtures/invalid_solver.json; then
            echo "invalid config unexpectedly accepted" >&2
            exit 1
          fi
